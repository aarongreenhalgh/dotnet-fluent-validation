trigger:
  branches:
    include: [main, master]

pr:
  branches:
    include: [main, master]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build dotnet-fluent-validation
    jobs:
      - job: Build
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - script: dotnet restore src
            displayName: Restore
          - script: dotnet build src --configuration Release --no-restore
            displayName: Build
          - script: dotnet test src --configuration Release --no-build --passWithNoTests
            displayName: Test
