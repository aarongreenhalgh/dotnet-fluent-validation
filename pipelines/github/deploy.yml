name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: |
          PROJ=$(find src -name "*.csproj" | head -n 1)
          dotnet publish "$PROJ" -c Release -o ./publish
      - name: Deploy placeholder
        run: |
          echo "Deploy dotnet-fluent-validation publish output to your hosting target."
          echo "Configure secrets before enabling a real deployment."
